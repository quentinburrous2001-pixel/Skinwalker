<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night of the Mimic 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#03060a;color:#fff;font-family:system-ui}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none}.p{background:#07101acc;border:1px solid #586675;border-radius:10px;padding:9px 12px;backdrop-filter:blur(5px)}#top{display:flex;justify-content:space-between;padding:12px}#help{position:fixed;bottom:12px;left:12px;font-size:12px}#cross{position:fixed;left:50%;top:50%;width:4px;height:4px;margin:-2px;background:white;border-radius:50%}.overlay{position:fixed;inset:0;background:#010409ee;display:flex;align-items:center;justify-content:center;z-index:5}.modal{text-align:center;width:min(680px,88vw)}h1{font-size:48px;letter-spacing:3px}button{font:inherit;font-weight:800;padding:14px 44px;background:#172330;color:white;border:1px solid #748291;border-radius:10px}.hidden{display:none}
</style></head><body>
<div id="hud"><div id="top"><div class="p">NIGHT <b id="time">00:00</b><br><small>WASD Move · Mouse Look</small></div><div class="p">HUNTED <b id="kills">0/5</b></div><div class="p">HUNGER <b id="hun">100</b> · SUSPICION <b id="sus">0</b></div></div><div id="cross"></div><div id="help" class="p"><b>WASD</b> Move · <b>Mouse</b> Look · <b>Shift</b> Sprint · <b>Q</b> Shapeshift · <b>E</b> Mimic · <b>Space</b> Hunt · <b>F</b> Howl · <b>Esc</b> Pause</div></div>
<div id="start" class="overlay"><div class="modal"><h1>NIGHT OF THE MIMIC</h1><p>Keyboard-and-mouse 3D edition. Click PLAY, then click the game to capture the mouse.</p><button id="play">PLAY</button></div></div>
<div id="pause" class="overlay hidden"><div class="modal"><h1>PAUSED</h1><button id="resume">RESUME</button></div></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
const S=new THREE.Scene();S.background=new THREE.Color(0x040912);S.fog=new THREE.Fog(0x040912,25,105);
const C=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,180),R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;document.body.appendChild(R.domElement);
S.add(new THREE.HemisphereLight(0x9db2d1,0x11160f,1.15));let moon=new THREE.DirectionalLight(0xbacbff,2.2);moon.position.set(-25,45,15);moon.castShadow=true;S.add(moon);
const M=c=>new THREE.MeshStandardMaterial({color:c,roughness:.85}),B=(w,h,d,c)=>{let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.castShadow=true;m.receiveShadow=true;return m};
let g=B(120,.2,120,0x172119);g.position.y=-.1;S.add(g);
for(let i=-50;i<=50;i+=10){let a=B(2,.03,120,0x282d2d);a.position.x=i;S.add(a);let b=B(120,.03,2,0x282d2d);b.position.z=i;S.add(b)}
for(let i=0;i<45;i++){let x=(Math.random()-.5)*96,z=(Math.random()-.5)*96;if(Math.abs(x%10)<2||Math.abs(z%10)<2)continue;let w=4+Math.random()*2,h=2.5+Math.random()*2.8,d=4+Math.random()*2,b=B(w,h,d,0x29373b);b.position.set(x,h/2,z);S.add(b);let r=B(w*1.1,.35,d*1.1,0x151c21);r.position.set(x,h+.15,z);r.rotation.y=.78;S.add(r)}
for(let i=0;i<50;i++){let x=(Math.random()-.5)*110,z=(Math.random()-.5)*110,t=B(.35,1.8,.35,0x46362a);t.position.set(x,.9,z);S.add(t);let c=new THREE.Mesh(new THREE.ConeGeometry(1.4,3.5,8),M(0x173321));c.position.set(x,3,z);c.castShadow=true;S.add(c)}
const player=new THREE.Group(),pb=B(.72,1.55,.5,0x263843);pb.position.y=.9;player.add(pb);let ph=new THREE.Mesh(new THREE.SphereGeometry(.34,18,12),M(0xd0aa82));ph.position.y=1.92;player.add(ph);S.add(player);
const names=["Mara","Eli","Jonah","Nora","Cal","June","Theo","Iris","Ben","Ruth","Sam","Mae"],people=[];
for(let i=0;i<12;i++){let p=new THREE.Group(),b=B(.58,1.45,.44,0x5e717b);b.position.y=.83;p.add(b);let h=new THREE.Mesh(new THREE.SphereGeometry(.3,16,11),M(0xc5a27d));h.position.y=1.72;p.add(h);p.position.set((Math.random()-.5)*82,0,(Math.random()-.5)*82);p.userData={alive:true,name:names[i],home:p.position.clone(),phase:Math.random()*7};S.add(p);people.push(p)}
const keys={};let run=false,pause=false,creature=true,kills=0,hunger=100,sus=0,t=0,yaw=0,pitch=-.12,lock=false,last=performance.now();
function say(x){let e=document.getElementById("help"),old=e.textContent;e.textContent=x;setTimeout(()=>e.textContent=old,1600)}
function near(max){let q=null,d0=max;for(let p of people)if(p.userData.alive){let d=p.position.distanceTo(player.position);if(d<d0)d0=d,q=p}return q}
function shift(){creature=!creature;pb.material.color.set(creature?0x263843:0x5e717b);say(creature?"TRUE FORM":"HUMAN FORM")}
function mimic(){let p=near(5);if(!p)return say("Move closer to someone.");creature=false;pb.material.color.set(0x5e717b);sus=Math.min(100,sus+3);say("Mimicking "+p.userData.name)}
function hunt(){if(!creature)return say("Press Q to reveal your true form.");let p=near(3.3);if(!p)return say("Get closer.");p.userData.alive=false;p.visible=false;kills++;hunger=Math.min(100,hunger+25);sus=Math.min(100,sus+15);document.getElementById("kills").textContent=kills+"/5";say("HUNT SUCCESS");}
function howl(){sus=Math.min(100,sus+8);say("HOWL")}
function toggle(){if(!run)return;pause=!pause;document.getElementById("pause").classList.toggle("hidden",!pause);if(pause)document.exitPointerLock();else R.domElement.requestPointerLock();last=performance.now()}
document.getElementById("play").onclick=()=>{document.getElementById("start").classList.add("hidden");run=true;R.domElement.requestPointerLock();last=performance.now()};
document.getElementById("resume").onclick=toggle;
R.domElement.onclick=()=>{if(run&&!pause)R.domElement.requestPointerLock()};
document.addEventListener("pointerlockchange",()=>lock=document.pointerLockElement===R.domElement);
document.addEventListener("mousemove",e=>{if(lock&&!pause){yaw-=e.movementX*.0025;pitch=Math.max(-.65,Math.min(.55,pitch-e.movementY*.002))}});
addEventListener("keydown",e=>{keys[e.key]=true;if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key))e.preventDefault();if(e.repeat)return;if(e.key.toLowerCase()=="q")shift();if(e.key.toLowerCase()=="e")mimic();if(e.key==" ")hunt();if(e.key.toLowerCase()=="f")howl();if(e.key=="Escape")toggle()});
addEventListener("keyup",e=>keys[e.key]=false);
function loop(){requestAnimationFrame(loop);let now=performance.now(),dt=Math.min((now-last)/1000,.05);last=now;if(run&&!pause){t+=dt;let f=(keys.w||keys.W||keys.ArrowUp?1:0)-(keys.s||keys.S||keys.ArrowDown?1:0),a=(keys.d||keys.D||keys.ArrowRight?1:0)-(keys.a||keys.A||keys.ArrowLeft?1:0),l=Math.hypot(f,a)||1,sp=keys.Shift?9:5;player.position.x+=(a/l*Math.cos(yaw)+f/l*Math.sin(yaw))*sp*dt;player.position.z+=(-a/l*Math.sin(yaw)+f/l*Math.cos(yaw))*sp*dt;player.position.x=Math.max(-55,Math.min(55,player.position.x));player.position.z=Math.max(-55,Math.min(55,player.position.z));hunger=Math.max(0,hunger-dt*.5);sus=Math.max(0,sus-dt*1.2);for(let p of people)if(p.userData.alive){let dx=p.position.x-player.position.x,dz=p.position.z-player.position.z,d=Math.hypot(dx,dz);if(d<8){p.position.x+=dx/Math.max(d,.1)*dt;p.position.z+=dz/Math.max(d,.1)*dt}else{p.position.x=p.userData.home.x+Math.sin(t*.25+p.userData.phase)*2;p.position.z=p.userData.home.z+Math.cos(t*.23+p.userData.phase)*2}}document.getElementById("hun").textContent=Math.round(hunger);document.getElementById("sus").textContent=Math.round(sus);document.getElementById("time").textContent=String(Math.floor(t/60)).padStart(2,"0")+":"+String(Math.floor(t%60)).padStart(2,"0")}C.position.set(player.position.x-Math.sin(yaw)*7,4.2,player.position.z-Math.cos(yaw)*7);C.lookAt(player.position.x+Math.sin(yaw)*4,1.9+pitch*3,player.position.z+Math.cos(yaw)*4);R.render(S,C)}loop();
addEventListener("resize",()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
</script></body></html>
